name: 🛡 Security issue
description: Report a security issue or vulnerability.
title: 'security: '
labels: [security]

body:
  - type: markdown
    attributes:
      value: |
        # OpenStream TV Security issue

        Important to note that your issue may have already been reported before. Please check for existing issues [here](https://github.com/wpfyorg/openstream-tv/labels/security).

  - type: textarea
    attributes:
      label: Security issue description
      description: How did you find the security issue? Any additional details that might help?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Add the steps to reproduce this security issue including your environment.
      placeholder: Step 1. Go to '...' Step 2. Click on '....' Step 3. Scroll down to '....'
    validations:
      required: true

  - type: textarea
    attributes:
      label: Relevant log output
      description: |
        Paste only the short log excerpt needed to show the issue, and sanitize it first.
        Remove tokens, cookies, Authorization values, passwords, OTPs, account/device IDs, tunnel/private hosts, and playlist URLs or access keys.
        Never upload store_v4.toml, the OpenStream data directory, /etc/config/openstream, .env files, browser storage/profile data, or TLS private keys.
        Follow https://wpfyorg.github.io/openstream-tv/troubleshooting-reporting-logs/ for collection commands and redaction examples.
        This field is automatically formatted as code, so no backticks are needed.
      render: shell
    validations:
      required: false

  - type: textarea
    attributes:
      label: Screenshots or videos
      description: Add screenshots or videos that show the security issue here.
      placeholder: Drag and drop the screenshots/videos into this box.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Solution
      description: If applicable, add a possible solution.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional context
      description: Add additional context here.
    validations:
      required: false

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your issue will be closed if you haven't done these steps.
      options:
        - label: I have searched the existing issues and this is a new and no duplicate or related to another open issue.
          required: true
        - label: I have written a short but informative title.
          required: true
        - label: I filled out all of the requested information in this issue properly.
          required: true
        - label: I checked all logs, screenshots and attachments and removed credentials, tokens, cookies, OTPs, playlist access keys and other private data.
          required: true
