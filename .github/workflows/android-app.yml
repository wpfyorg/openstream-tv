name: Android TV and mobile app

on:
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-slim
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Package slim server executables
        shell: bash
        run: ./android/scripts/build-rust-binaries.sh
      - name: Install Gradle
        shell: bash
        env:
          GRADLE_VERSION: "8.10.2"
        run: |
          set -euo pipefail
          url="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/gradle.zip" "$url"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Gradle ${GRADLE_VERSION} download failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build sideloadable debug APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Check packaged ABIs
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libopenstream_exec.so"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: openstream-tv-slim-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
