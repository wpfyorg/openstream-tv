name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'landing/**'
      - '.github/workflows/docs.yml'
      - 'scripts/check-doc-links.py'
      - 'scripts/build-docs-site.py'
  pull_request:
    types: [labeled, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'landing/**'
      - '.github/workflows/docs.yml'
      - 'scripts/check-doc-links.py'
      - 'scripts/build-docs-site.py'

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Pull requests run only after Codex review is clean: the `codex-clean` label
    # is added once the review has no open findings. Pushes to main always run.
    # A "skipped" result on an unlabeled pull request means CI has not run, not
    # that it passed; any label event on a labeled PR re-runs the real checks.
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'codex-clean')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/check-doc-links.py
      # One Pages artifact: the landing page owns the root of
      # https://wpfyorg.github.io/openstream-tv/ and the help centre sits under
      # /docs. Both builds put their assets in different directories (`assets`
      # and `_app`), so they can share the artifact.
      - run: bun install --frozen-lockfile
        working-directory: landing
      - run: bun run build
        working-directory: landing
        env:
          LANDING_BASE: /openstream-tv/
      - run: bun install --frozen-lockfile
        working-directory: docs-site
      - run: bun run build
        working-directory: docs-site
        env:
          DOCS_BASE: /openstream-tv
      - name: Assemble the site
        run: |
          cp -R landing/dist/client/. docs-site/build/
          test -f docs-site/build/index.html
          test -f docs-site/build/docs/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site/build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
